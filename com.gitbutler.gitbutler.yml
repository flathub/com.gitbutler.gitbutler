id: com.gitbutler.gitbutler
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.rust-stable
command: gitbutler-tauri
rename-desktop-file: GitButler.desktop
rename-icon: gitbutler-tauri

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=gpg-agent
  - --socket=ssh-auth
  - --filesystem=host
  - --filesystem=xdg-run/gvfsd
  - --own-name=com.gitbutler.app
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: git
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.gz
        sha256: 0842dc384a23ac33ba3e570c4f3a8ded85963ee4713b1cd21153c3db41813d1e
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: gitbutler
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin:/run/build/gitbutler/pnpm/bin
      env:
        CARGO_HOME: /run/build/gitbutler/cargo
        VERSION: 0.22.0
    build-commands:
      - ln -s pnpm.cjs pnpm/bin/pnpm
      - pnpm install --offline
      - pnpm tauri build --features builtin-but,disable-auto-updates,packaged-but-distribution
        --config "$(jq -c --arg version "$VERSION" '.version = $version | .bundle.externalBin
        = ["gitbutler-git-askpass"] | .bundle.createUpdaterArtifacts = false' crates/gitbutler-tauri/tauri.conf.release.json)"
        --bundles deb
      - mv target/tauri/release/bundle/deb/GitButler*/data/usr/bin/* /app/bin
      - ln -s gitbutler-tauri /app/bin/but
      - mv target/tauri/release/bundle/deb/GitButler*/data/usr/share/* /app/share
    sources:
      - type: git
        url: https://github.com/gitbutlerapp/gitbutler.git
        tag: release/0.22.3
        commit: 0ba35dc675c0d0eebcf2e1d5e114b73d46019942
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gitbutlerapp/gitbutler/releases/latest
          tag-query: .tag_name
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.20.0.tgz
        sha256: 47a3352808501b8d1ef20112273b6a5dcfa53d28a55bcce36d268e878bd6bfe9
        dest: pnpm
      - cargo-sources.json
      - node-sources.json
