id: com.gitbutler.gitbutler
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: gitbutler-tauri
rename-desktop-file: GitButler.desktop
rename-icon: gitbutler-tauri

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=gpg-agent
  - --socket=ssh-auth
  - --filesystem=host
  - --filesystem=xdg-run/gvfsd
  - --own-name=com.gitbutler.app
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: git
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.gz
        sha256: 826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: gitbutler
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/gitbutler/bin
      env:
        CARGO_HOME: /run/build/gitbutler/cargo
        CARGO_NET_OFFLINE: 'true'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        CHANNEL: release
        VERSION: 0.23.1
    build-commands:
      - chmod 755 pnpm
      - mkdir bin && mv pnpm dist bin/
      - test "$(pnpm --version)" = "12.5.1"
      # Use Node from SDK instead of downloading the lockfile's managed runtime.
      - pnpm install --offline --frozen-lockfile --trust-lockfile --no-runtime
      - pnpm tauri build --features builtin-but,disable-auto-updates,packaged-but-distribution
        --config "$(jq -c --arg version "$VERSION" '.version = $version | .bundle.externalBin
        = ["gitbutler-git-askpass"] | .bundle.createUpdaterArtifacts = false' crates/gitbutler-tauri/tauri.conf.release.json)"
        --bundles deb
      - mv target/tauri/release/bundle/deb/GitButler*/data/usr/bin/* /app/bin
      - ln -s gitbutler-tauri /app/bin/but
      - mv target/tauri/release/bundle/deb/GitButler*/data/usr/share/* /app/share
    sources:
      - type: git
        url: https://github.com/gitbutlerapp/gitbutler.git
        tag: release/0.23.1
        commit: d6feaf66d2040c764b335dfa6486b1a964b7ac5d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gitbutlerapp/gitbutler/releases/latest
          tag-query: .tag_name
      # pnpm setup in the same way that Podman does it:
      # https://github.com/flathub/io.podman_desktop.PodmanDesktop/blob/master/io.podman_desktop.PodmanDesktop.yml
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v12.5.1/pnpm-linux-x64.tar.gz
        sha256: 5a397dfb6b3d4b07d3d7769586aeb471048faf04299a492e2808b95a9a1c701f
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v12.5.1/pnpm-linux-arm64.tar.gz
        sha256: 84e1290e82c800acd406b6db27e9650e15db3c2344d12162cc305ea1f942c6ff
        strip-components: 0
        only-arches:
          - aarch64
      - cargo-sources.json
      - node-sources.json
